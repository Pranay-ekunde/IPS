<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Item & Purchase Management</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav>
    <span class="brand">📦 IPM System</span>
    <a href="index.html" class="active">Dashboard</a>
    <a href="pages/item-types.html">Item Types</a>
    <a href="pages/items.html">Items</a>
    <a href="pages/purchases.html">Purchases</a>
    <a href="pages/stock.html">Stock</a>
  </nav>

  <div class="container">
    <h2>Dashboard</h2>
    <div class="form-row" style="margin-bottom:24px">
      <div class="card" style="text-align:center">
        <div style="font-size:2rem;font-weight:700;color:#1a237e" id="stat-items">—</div>
        <div style="color:#666;margin-top:4px">Total Items</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:2rem;font-weight:700;color:#2e7d32" id="stat-active">—</div>
        <div style="color:#666;margin-top:4px">Active Items</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:2rem;font-weight:700;color:#c62828" id="stat-out">—</div>
        <div style="color:#666;margin-top:4px">Out of Stock</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:2rem;font-weight:700;color:#0277bd" id="stat-orders">—</div>
        <div style="color:#666;margin-top:4px">Total Orders</div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:16px">Quick Links</h2>
      <div class="btn-group">
        <a class="btn btn-primary" href="pages/items.html">Manage Items</a>
        <a class="btn btn-success" href="pages/purchases.html">View Purchases</a>
        <a class="btn btn-info" href="pages/stock.html">Stock Overview</a>
        <a class="btn btn-warning" href="pages/item-types.html">Item Types</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function loadStats() {
      try {
        const [items, purchases] = await Promise.all([
          apiFetch('/items'), apiFetch('/purchases')
        ]);
        document.getElementById('stat-items').textContent = items.length;
        document.getElementById('stat-active').textContent = items.filter(i => i.active).length;
        document.getElementById('stat-out').textContent = items.filter(i => i.stock_available === 0).length;
        document.getElementById('stat-orders').textContent = purchases.length;
      } catch (e) {
        console.error('Failed to load dashboard stats:', e);
      }
    }
    loadStats();
  </script>
</body>
</html>
